name: Medsina Release & OTA Pipeline

on:
  push:
    tags:
      - 'v*.*.*' # Trigger when pushing a tag like v1.0.1, v1.1.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (ex: 1.0.1)'
        required: true
        default: '1.0.1'
        type: string
      build_number:
        description: 'Build Number (ex: 2)'
        required: true
        default: '2'
        type: string
      is_mandatory:
        description: 'Mise à jour obligatoire (force update)'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Notes de version en Markdown'
        required: false
        default: '### Nouveautés Medsina ✨\n- Améliorations de performance\n- Nouveaux résumés de cours et protocoles cliniques'
        type: string

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # JOB 1 : Build Android (APK + Google Play AAB)
  # ----------------------------------------------------
  build-android:
    name: 📱 Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Configure App Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAT: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lib/core/config
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "class AppSecrets { static const String geminiApiKey = '$GEMINI_API_KEY'; static const String githubPat = '$GITHUB_PAT'; }" > lib/core/config/app_secrets.dart
          elif [ -f lib/core/config/app_secrets.dart.example ]; then
            cp lib/core/config/app_secrets.dart.example lib/core/config/app_secrets.dart
          else
            echo "class AppSecrets { static const String geminiApiKey = ''; static const String githubPat = ''; }" > lib/core/config/app_secrets.dart
          fi

      - name: 🔑 Configure Android Release Signing Key
        run: |
          mkdir -p android
          cat << 'EOF' > android/key.properties
          storePassword=medsina2027
          keyPassword=medsina2027
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Build APK
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          echo "Building Android APK version $VERSION+$BUILD_NUM"
          flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUM

      - name: 🛠️ Build App Bundle (AAB)
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          flutter build appbundle --release --build-name=$VERSION --build-number=$BUILD_NUM

      - name: 📦 Prepare Android Deliverables
        run: |
          mkdir -p android-dist
          cp build/app/outputs/flutter-apk/app-release.apk android-dist/app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab android-dist/app-release.aab

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-dist/*

  # ----------------------------------------------------
  # JOB 2 : Build Windows Desktop (x64)
  # ----------------------------------------------------
  build-windows:
    name: 🖥️ Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Configure App Secrets
        shell: pwsh
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAT: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "lib/core/config"
          if ($env:GEMINI_KEY) {
            "class AppSecrets { static const String geminiApiKey = '$($env:GEMINI_KEY)'; static const String githubPat = '$($env:GITHUB_PAT)'; }" | Out-File -FilePath "lib/core/config/app_secrets.dart" -Encoding utf8
          } elseif (Test-Path "lib/core/config/app_secrets.dart.example") {
            Copy-Item -Path "lib/core/config/app_secrets.dart.example" -Destination "lib/core/config/app_secrets.dart" -Force
          } else {
            "class AppSecrets { static const String geminiApiKey = ''; static const String githubPat = ''; }" | Out-File -FilePath "lib/core/config/app_secrets.dart" -Encoding utf8
          }

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: 🛠️ Build Windows Release
        run: |
          $VERSION = "${{ inputs.version || github.ref_name }}".TrimStart('v')
          $BUILD_NUM = "${{ inputs.build_number || github.run_number }}"
          flutter build windows --release --build-name=$VERSION --build-number=$BUILD_NUM

      - name: 📦 Build Windows Setup Installer (.exe)
        run: |
          $VERSION = "${{ inputs.version || github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path "win-dist"
          $iscc = "iscc"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          echo "Compiling Inno Setup installer for version $VERSION using $iscc..."
          & $iscc /DMyAppVersion="$VERSION" windows/installer/medsina_setup.iss

      - name: 🗜️ Archive Windows Portable (.zip)
        run: |
          New-Item -ItemType Directory -Force -Path "win-dist"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "win-dist\Medsina_Windows_x64.zip" -Force

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: win-dist/*

  # ----------------------------------------------------
  # JOB 3 : Build Web Production
  # ----------------------------------------------------
  build-web:
    name: 🌐 Build Web Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Configure App Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAT: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p lib/core/config
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "class AppSecrets { static const String geminiApiKey = '$GEMINI_API_KEY'; static const String githubPat = '$GITHUB_PAT'; }" > lib/core/config/app_secrets.dart
          elif [ -f lib/core/config/app_secrets.dart.example ]; then
            cp lib/core/config/app_secrets.dart.example lib/core/config/app_secrets.dart
          else
            echo "class AppSecrets { static const String geminiApiKey = ''; static const String githubPat = ''; }" > lib/core/config/app_secrets.dart
          fi

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Build Web
        run: |
          RAW_TAG="${{ inputs.version || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          flutter build web --release --base-href / --build-name=$TAG --build-number=$BUILD_NUM
          cat << 'EOF' > build/web/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
            <FilesMatch "\.(html|json)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires 0
            </FilesMatch>
            <FilesMatch "(flutter_service_worker|flutter_bootstrap)\.js$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires 0
            </FilesMatch>
          </IfModule>
          EOF

      - name: 🗜️ Archive Web
        run: |
          mkdir -p web-dist
          cd build/web && zip -r ../../web-dist/Medsina_Web_Production.zip . && cd ../..

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: web-dist/Medsina_Web_Production.zip

  # ----------------------------------------------------
  # JOB 4 : GitHub Release & Supabase OTA Broadcast
  # ----------------------------------------------------
  publish-release-and-ota:
    name: 🚀 Publish GitHub Release & Register OTA
    needs: [build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist-release

      - name: 📥 Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist-release

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: dist-release

      - name: 🏷️ Format Release Names
        id: vars
        run: |
          RAW_TAG="${{ inputs.version || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          echo "tag=v$TAG" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "build=$BUILD_NUM" >> $GITHUB_OUTPUT

          echo "🔍 Contents of downloaded artifacts:"
          ls -laR dist-release

          # Reliably find and move files to dist-release root regardless of directory nesting
          find dist-release -type f -name "*app-release.apk" -exec mv {} "dist-release/Medsina_v${TAG}_Android.apk" \;
          find dist-release -type f -name "*app-release.aab" -exec mv {} "dist-release/Medsina_v${TAG}_GooglePlay.aab" \;
          find dist-release -type f \( -name "*Windows_Setup.exe" -o -name "*Setup.exe" \) -exec mv {} "dist-release/Medsina_v${TAG}_Windows_Setup.exe" \;
          find dist-release -type f -name "*Windows_x64.zip" -exec mv {} "dist-release/Medsina_v${TAG}_Windows_Portable.zip" \;
          find dist-release -type f \( -name "*Web_Production.zip" -o -name "*Web.zip" \) -exec mv {} "dist-release/Medsina_v${TAG}_Web.zip" \;

          # Clean any leftover subdirectories
          find dist-release -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true

          echo "✅ Final release deliverables in dist-release:"
          ls -la dist-release

      - name: 🎉 Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Medsina v${{ steps.vars.outputs.version }} (Build ${{ steps.vars.outputs.build }})"
          body: |
            ${{ inputs.release_notes || '### Nouveautés de Medsina ✨\n- Améliorations de performance et stabilité.' }}

            ---
            ### ⚡ Téléchargements Directs Officiels (Serveur Rapide MedevSync / Octenium)
            - 📱 **Android APK** : [Télécharger Medsina v${{ steps.vars.outputs.version }} (.apk)](https://medsina.medevsync.com/releases/Medsina_v${{ steps.vars.outputs.version }}_Android.apk) — [Lien Direct Permanent](https://medsina.medevsync.com/download/medsina.apk)
            - 💻 **Windows Setup (.exe)** : [Télécharger l'Installateur PC](https://medsina.medevsync.com/releases/Medsina_v${{ steps.vars.outputs.version }}_Windows_Setup.exe) — [Lien Direct Permanent](https://medsina.medevsync.com/download/medsina-setup.exe)
            - 🌐 **Version Web en Ligne** : [https://medsina.medevsync.com](https://medsina.medevsync.com)

            ---
            ### 📦 Miroirs GitHub
            - **Android APK** : [Medsina_v${{ steps.vars.outputs.version }}_Android.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_Android.apk)
            - **Google Play AAB** : [Medsina_v${{ steps.vars.outputs.version }}_GooglePlay.aab](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_GooglePlay.aab)
            - **Windows Installateur (.exe)** : [Medsina_v${{ steps.vars.outputs.version }}_Windows_Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_Windows_Setup.exe)
            - **Windows Version Portable (.zip)** : [Medsina_v${{ steps.vars.outputs.version }}_Windows_Portable.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_Windows_Portable.zip)
            - **Web Bundle (.zip)** : [Medsina_v${{ steps.vars.outputs.version }}_Web.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_Web.zip)
          files: |
            dist-release/*

      - name: 🚀 Upload Releases to Octenium Hosting & Update OTA Links
        env:
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          BUILD: ${{ steps.vars.outputs.build }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ℹ️ SUPABASE_SERVICE_ROLE_KEY is not set. Skipping Octenium upload."
            exit 0
          fi

          python -c "
          import os, requests, json, ftplib
          from pathlib import Path

          url = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
          }

          tag = os.environ.get('TAG') or 'v' + os.environ.get('VERSION', '1.0.0')
          version = os.environ.get('VERSION', '1.0.0')
          build = int(os.environ.get('BUILD', '1'))
          repo = os.environ.get('REPO', 'dochafedh26/medsina')

          # 1. Fetch Octenium FTP credentials from Supabase admin_system_settings
          ftp_host = 'medevsync.com'
          ftp_user = None
          ftp_pass = None
          try:
              r = requests.get(f'{url}/rest/v1/admin_system_settings?select=setting_key,setting_value', headers=headers)
              for row in r.json():
                  k, v = row.get('setting_key'), row.get('setting_value')
                  if k == 'octenium_ftp_host': ftp_host = v
                  elif k == 'octenium_ftp_user': ftp_user = v
                  elif k == 'octenium_ftp_password': ftp_pass = v
          except Exception as e:
              print(f'Warning fetching FTP settings: {e}')

          # Default URLs (fallback to GitHub if FTP upload fails)
          apk_url = f'https://github.com/{repo}/releases/download/{tag}/Medsina_v{version}_Android.apk'
          win_url = f'https://github.com/{repo}/releases/download/{tag}/Medsina_v{version}_Windows_Setup.exe'

          if ftp_user and ftp_pass:
              try:
                  print(f'Connecting to FTP {ftp_host}...')
                  ftp = ftplib.FTP(ftp_host, timeout=60)
                  ftp.login(ftp_user, ftp_pass)
                  ftp.cwd('medsina.medevsync.com')

                  for d in ['releases', 'download']:
                      try: ftp.mkd(d)
                      except Exception: pass

                  apk_file = Path(f'dist-release/Medsina_v{os.environ.get(\"VERSION\")}_Android.apk')
                  if apk_file.exists():
                      print('Uploading Android APK to Octenium...')
                      with open(apk_file, 'rb') as f:
                          ftp.storbinary(f'STOR releases/{apk_file.name}', f)
                      with open(apk_file, 'rb') as f:
                          ftp.storbinary('STOR download/medsina.apk', f)
                      apk_url = f'https://medsina.medevsync.com/releases/{apk_file.name}'
                      print(f'✅ Android APK live at: {apk_url}')

                  win_file = Path(f'dist-release/Medsina_v{os.environ.get(\"VERSION\")}_Windows_Setup.exe')
                  if win_file.exists():
                      print('Uploading Windows Setup to Octenium...')
                      with open(win_file, 'rb') as f:
                          ftp.storbinary(f'STOR releases/{win_file.name}', f)
                      with open(win_file, 'rb') as f:
                          ftp.storbinary('STOR download/medsina-setup.exe', f)
                      win_url = f'https://medsina.medevsync.com/releases/{win_file.name}'
                      print(f'✅ Windows Setup live at: {win_url}')

                  web_zips = list(Path('dist-release').glob('*Web*.zip'))
                  if web_zips:
                      web_zip = web_zips[0]
                      import zipfile
                      print(f'Extracting {web_zip.name} for Web deployment to Octenium...')
                      extract_dir = Path('web_extracted')
                      extract_dir.mkdir(exist_ok=True)
                      with zipfile.ZipFile(web_zip, 'r') as zf:
                          zf.extractall(extract_dir)

                      htaccess_file = extract_dir / '.htaccess'
                      if not htaccess_file.exists():
                          htaccess_file.write_text('<IfModule mod_rewrite.c>\nRewriteEngine On\nRewriteBase /\nRewriteRule ^index\\.html$ - [L]\nRewriteCond %{REQUEST_FILENAME} !-f\nRewriteCond %{REQUEST_FILENAME} !-d\nRewriteRule . /index.html [L]\n</IfModule>\n')

                      print('Deploying Medsina Web app files to https://medsina.medevsync.com ...')
                      uploaded_count = 0
                      for root, dirs, files in os.walk(extract_dir):
                          rel = Path(root).relative_to(extract_dir).as_posix()
                          remote_dir = '' if rel == '.' else rel

                          if remote_dir:
                              curr = ''
                              for part in remote_dir.split('/'):
                                  curr = f'{curr}/{part}'.strip('/')
                                  try: ftp.mkd(curr)
                                  except Exception: pass

                          for file in files:
                              local_filepath = Path(root) / file
                              target_remote = f'{remote_dir}/{file}'.strip('/')
                              with open(local_filepath, 'rb') as f:
                                  ftp.storbinary(f'STOR {target_remote}', f)
                              uploaded_count += 1

                      print(f'✅ Medsina Web successfully deployed to Octenium ({uploaded_count} files)!')

                  ftp.quit()
              except Exception as e:
                  print(f'FTP upload error (falling back to GitHub URLs): {e}')

          # 2. Register release into Supabase
          notes = '''${{ inputs.release_notes || 'Mise à jour officielle de Medsina.' }}'''
          is_mandatory = '${{ inputs.is_mandatory }}'.lower() == 'true'

          records = [
              {
                  'platform': 'android',
                  'version_name': version,
                  'build_number': build,
                  'release_notes': notes,
                  'download_url': apk_url,
                  'is_mandatory': is_mandatory,
                  'min_supported_build': build if is_mandatory else 1,
                  'is_active': True
              },
              {
                  'platform': 'windows',
                  'version_name': '$VERSION',
                  'build_number': int('$BUILD'),
                  'release_notes': notes,
                  'download_url': win_url,
                  'is_mandatory': is_mandatory,
                  'min_supported_build': int('$BUILD') if is_mandatory else 1,
                  'is_active': True
              }
          ]

          for rec in records:
              r = requests.post(f'{url}/rest/v1/app_releases', headers=headers, json=rec)
              print(f'Supabase OTA registration for {rec[\"platform\"]}: status {r.status_code}')
          "

