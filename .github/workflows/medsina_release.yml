name: Medsina Release & OTA Pipeline

on:
  push:
    tags:
      - 'v*.*.*' # Trigger when pushing a tag like v1.0.1, v1.1.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (ex: 1.0.1)'
        required: true
        default: '1.0.1'
        type: string
      build_number:
        description: 'Build Number (ex: 2)'
        required: true
        default: '2'
        type: string
      is_mandatory:
        description: 'Mise à jour obligatoire (force update)'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Notes de version en Markdown'
        required: false
        default: '### Nouveautés Medsina ✨\n- Améliorations de performance\n- Nouveaux résumés de cours et protocoles cliniques'
        type: string

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # JOB 1 : Build Android (APK + Google Play AAB)
  # ----------------------------------------------------
  build-android:
    name: 📱 Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Configure App Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p lib/core/config
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "class AppSecrets { static const String geminiApiKey = '$GEMINI_API_KEY'; }" > lib/core/config/app_secrets.dart
          elif [ -f lib/core/config/app_secrets.dart.example ]; then
            cp lib/core/config/app_secrets.dart.example lib/core/config/app_secrets.dart
          else
            echo "class AppSecrets { static const String geminiApiKey = ''; }" > lib/core/config/app_secrets.dart
          fi

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Build APK
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          echo "Building Android APK version $VERSION+$BUILD_NUM"
          flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUM

      - name: 🛠️ Build App Bundle (AAB)
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          flutter build appbundle --release --build-name=$VERSION --build-number=$BUILD_NUM

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # ----------------------------------------------------
  # JOB 2 : Build Windows Desktop (x64)
  # ----------------------------------------------------
  build-windows:
    name: 🖥️ Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Configure App Secrets
        shell: pwsh
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path "lib/core/config"
          if ($env:GEMINI_KEY) {
            "class AppSecrets { static const String geminiApiKey = '$($env:GEMINI_KEY)'; }" | Out-File -FilePath "lib/core/config/app_secrets.dart" -Encoding utf8
          } elseif (Test-Path "lib/core/config/app_secrets.dart.example") {
            Copy-Item -Path "lib/core/config/app_secrets.dart.example" -Destination "lib/core/config/app_secrets.dart" -Force
          } else {
            "class AppSecrets { static const String geminiApiKey = ''; }" | Out-File -FilePath "lib/core/config/app_secrets.dart" -Encoding utf8
          }

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Build Windows Release
        run: |
          $VERSION = "${{ inputs.version || github.ref_name }}".TrimStart('v')
          $BUILD_NUM = "${{ inputs.build_number || github.run_number }}"
          flutter build windows --release --build-name=$VERSION --build-number=$BUILD_NUM

      - name: 🗜️ Archive Windows Release
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\Medsina_Windows_x64.zip" -Force

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/Medsina_Windows_x64.zip

  # ----------------------------------------------------
  # JOB 3 : Build Web Production
  # ----------------------------------------------------
  build-web:
    name: 🌐 Build Web Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Configure App Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p lib/core/config
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "class AppSecrets { static const String geminiApiKey = '$GEMINI_API_KEY'; }" > lib/core/config/app_secrets.dart
          elif [ -f lib/core/config/app_secrets.dart.example ]; then
            cp lib/core/config/app_secrets.dart.example lib/core/config/app_secrets.dart
          else
            echo "class AppSecrets { static const String geminiApiKey = ''; }" > lib/core/config/app_secrets.dart
          fi

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Build Web
        run: flutter build web --release

      - name: 🗜️ Archive Web
        run: |
          cd build/web && zip -r ../../Medsina_Web_Production.zip . && cd ../..

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: Medsina_Web_Production.zip

  # ----------------------------------------------------
  # JOB 4 : GitHub Release & Supabase OTA Broadcast
  # ----------------------------------------------------
  publish-release-and-ota:
    name: 🚀 Publish GitHub Release & Register OTA
    needs: [build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist-release

      - name: 📥 Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist-release

      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release
          path: dist-release

      - name: 🏷️ Format Release Names
        id: vars
        run: |
          RAW_TAG="${{ inputs.version || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          echo "tag=v$TAG" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "build=$BUILD_NUM" >> $GITHUB_OUTPUT

          # Rename files clearly
          mv dist-release/app-release.apk "dist-release/Medsina_v${TAG}_Android.apk"
          mv dist-release/app-release.aab "dist-release/Medsina_v${TAG}_GooglePlay.aab"
          mv dist-release/Medsina_Windows_x64.zip "dist-release/Medsina_v${TAG}_Windows_x64.zip"
          mv dist-release/Medsina_Web_Production.zip "dist-release/Medsina_v${TAG}_Web.zip"

      - name: 🎉 Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Medsina v${{ steps.vars.outputs.version }} (Build ${{ steps.vars.outputs.build }})"
          body: |
            ${{ inputs.release_notes || '### Nouveautés de Medsina ✨\n- Améliorations de performance et stabilité.' }}

            ---
            ### 📦 Téléchargements Directs
            - **Android APK** : [Medsina_v${{ steps.vars.outputs.version }}_Android.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_Android.apk)
            - **Google Play AAB** : [Medsina_v${{ steps.vars.outputs.version }}_GooglePlay.aab](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_GooglePlay.aab)
            - **Windows x64** : [Medsina_v${{ steps.vars.outputs.version }}_Windows_x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_Windows_x64.zip)
            - **Web Bundle** : [Medsina_v${{ steps.vars.outputs.version }}_Web.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Medsina_v${{ steps.vars.outputs.version }}_Web.zip)
          files: |
            dist-release/*

      - name: 📡 Register New OTA Release into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qzfssrhhuorljftpdvjm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ℹ️ SUPABASE_SERVICE_ROLE_KEY is not set. Skipping Supabase OTA registration."
            exit 0
          fi
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          BUILD="${{ steps.vars.outputs.build }}"
          REPO="${{ github.repository }}"
          APK_URL="https://github.com/$REPO/releases/download/$TAG/Medsina_v${VERSION}_Android.apk"
          WIN_URL="https://github.com/$REPO/releases/download/$TAG/Medsina_v${VERSION}_Windows_x64.zip"

          python -c "
          import os, requests, json

          url = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
          }

          notes = '''${{ inputs.release_notes || 'Mise à jour officielle de Medsina.' }}'''
          is_mandatory = '${{ inputs.is_mandatory }}'.lower() == 'true'

          records = [
              {
                  'platform': 'android',
                  'version_name': '$VERSION',
                  'build_number': int('$BUILD'),
                  'release_notes': notes,
                  'download_url': '$APK_URL',
                  'is_mandatory': is_mandatory,
                  'min_supported_build': int('$BUILD') if is_mandatory else 1,
                  'is_active': True
              },
              {
                  'platform': 'windows',
                  'version_name': '$VERSION',
                  'build_number': int('$BUILD'),
                  'release_notes': notes,
                  'download_url': '$WIN_URL',
                  'is_mandatory': is_mandatory,
                  'min_supported_build': int('$BUILD') if is_mandatory else 1,
                  'is_active': True
              }
          ]

          for rec in records:
              r = requests.post(f'{url}/rest/v1/app_releases', headers=headers, json=rec)
              print(f'Supabase OTA registration for {rec[\"platform\"]}: status {r.status_code}')
          "

