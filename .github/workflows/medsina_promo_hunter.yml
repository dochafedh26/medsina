name: 🎯 Medsina - Chasseur Promo Telegram & Assistant Facebook

on:
  schedule:
    # 2 fois par jour aux heures de pointe étudiante (Heure Algérie UTC+1) :
    # 11:00 UTC (12:00 Algérie) : Détection & Réponses Entraide Médicale
    # 19:00 UTC (20:00 Algérie) : Session du soir
    - cron: '0 11,19 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Cible d exécution : telegram, facebook, ou all'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - telegram
          - facebook
      max_replies:
        description: 'Nombre maximum de réponses Telegram'
        required: false
        default: '2'
        type: string

jobs:
  hunt_and_reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install telethon requests pillow

      - name: 💬 Exécution Assistant Commentaires Facebook
        if: ${{ inputs.target == 'all' || inputs.target == 'facebook' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/automation/facebook_page_assistant.py --live

      - name: 🔍 Exécution Chasseur Promo Telegram (Option B)
        if: ${{ inputs.target == 'all' || inputs.target == 'telegram' }}
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          if [ -n "$TELEGRAM_SESSION_B64" ]; then
            echo "$TELEGRAM_SESSION_B64" | base64 -d > scripts/automation/medsina_user.session
          fi
          python scripts/automation/telegram_promo_hunter.py --live --max ${{ inputs.max_replies || 2 }}
