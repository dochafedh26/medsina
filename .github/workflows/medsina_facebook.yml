name: 📢 MedevSync - Générateur de Prompts IA Facebook & Notification Admin (2x/Jour)

on:
  schedule:
    # Déclenché 2 fois par jour tous les jours :
    # 08:00 UTC (~09h00 Algérie) : Post Médical / Extrait Clinique
    # 17:00 UTC (~18h00 Algérie) : Post Commercial / Promotionnel & Téléchargement
    - cron: '0 8,17 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Visée du post : auto (selon heure), commercial (téléchargement), medical (extrait clinique)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - commercial
          - medical
      topic:
        description: 'Thème optionnel spécifique (ex: OAP, Analyseur ordonnance, ou laisser vide)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publier directement le post et l image sur la page Facebook'
        required: false
        default: 'false'
        type: string
      dry_run:
        description: 'Mode test sans mise à jour des notifications'
        required: false
        default: false
        type: boolean

concurrency:
  group: medsina-facebook-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-facebook-post:
    name: 🧠 Génération et/ou Publication Facebook & Notification Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installer les dépendances (Pillow, requests)
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: 📢 Exécuter le générateur de post / prompt Facebook MedevSync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qzfssrhhuorljftpdvjm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          CMD="python scripts/automation/facebook_post_generator.py"
          if [ -n "${{ github.event.inputs.type }}" ]; then
            CMD="$CMD --type '${{ github.event.inputs.type }}'"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic '${{ github.event.inputs.topic }}'"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ github.event.inputs.publish }}" = "true" ] || [ "${{ github.event.inputs.publish }}" = "1" ]; then
            CMD="$CMD --publish"
          fi
          echo "🚀 Exécution : $CMD"
          eval $CMD
