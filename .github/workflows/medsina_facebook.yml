name: 📢 MedevSync - Publication Facebook & Telegram Officielle (Auto 3x/Jour)

on:
  schedule:
    # 3 publications automatiques quotidiennes (Heure Algérie UTC+1) :
    # 06:00 UTC (07:00 Algérie) : 🎯 QCM Annales Réelles du Concours (Quiz du matin)
    # 12:00 UTC (13:00 Algérie) : 🩺 Mémento Clinique & Conduite à Tenir d'Urgence
    # 18:00 UTC (19:00 Algérie) : 🚀 Promo Application Medsina & Téléchargement
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Visée du post : auto (selon heure), commercial (téléchargement), medical (extrait clinique)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - commercial
          - medical
          - qcm
      topic:
        description: 'Thème optionnel spécifique (ex: OAP, Analyseur ordonnance, ou laisser vide)'
        required: false
        default: ''
        type: string
      screenshot:
        description: 'Nom de la capture d écran (ex: Screenshot 2026-10-20 175342_dashboard.png) ou URL'
        required: false
        default: ''
        type: string
      mockup_type:
        description: 'Format de maquette : auto, desktop, phone, duo, none'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - desktop
          - phone
          - duo
          - none
      dry_run:
        description: 'Mode test sans publication sur les réseaux sociaux'
        required: false
        default: false
        type: boolean

concurrency:
  group: medsina-facebook-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-facebook-post:
    name: 🚀 Publication Directe Facebook & Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installer les dépendances (Pillow, requests)
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: 📢 Exécuter la publication Facebook et Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qzfssrhhuorljftpdvjm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          INPUT_TYPE: ${{ github.event.inputs.type }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_SCREENSHOT: ${{ github.event.inputs.screenshot }}
          INPUT_MOCKUP_TYPE: ${{ github.event.inputs.mockup_type }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/automation/run_publisher_workflow.py
