name: 🩺 Medsina - Conduites à Tenir (CAT)

on:
  schedule:
    # Déclenché quotidiennement à 02:15 UTC (= 03:15 heure d'Algérie)
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'ID optionnel d un cours cible pour la CAT (ex: Blida_NEUROLOGIE_COMA)'
        required: false
        default: ''
        type: string

concurrency:
  group: medsina-cat-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-cat:
    name: 🏥 Génération Conduite à Tenir Clinique
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot (CAT)
        env:
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CMD="python scripts/automation/medsina_agent.py --action cat"
          if [ -n "${{ inputs.course_id }}" ]; then
            CMD="$CMD --course-id '${{ inputs.course_id }}'"
          fi
          echo "🚀 Exécution : $CMD"
          eval $CMD

      - name: 💾 Synchroniser le cache local des assets hors-ligne
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json
          if git diff --staged --quiet; then
            echo "Aucune modification de fichier JSON à valider."
          else
            git commit -m "chore(automation): sync autonomous CAT protocols [skip ci]"
            git push
          fi

