name: Medsina Multi-App Release

on:
  push:
    branches:
      - main
    tags:
      - 'residanat-v*'
      - 'clinique-v*'
      - 'externat-v*'
      - 'all-v*'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App to build and release'
        required: true
        type: choice
        options:
          - medsina_residanat
          - medsina_clinique
          - medsina_externat
          - medsina_all_in_one
      build_target:
        description: 'Platform target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - web
          - windows
      publish_release:
        description: 'Publish GitHub Release with APK/AAB/Web/Windows assets'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  detect-apps:
    runs-on: ubuntu-latest
    outputs:
      apps_matrix: ${{ steps.compute.outputs.apps_matrix }}
      has_apps: ${{ steps.compute.outputs.has_apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
        with:
          filters: |
            residanat:
              - 'apps/medsina_residanat/**'
              - 'packages/medsina_residanat_pkg/**'
            externat:
              - 'apps/medsina_externat/**'
              - 'packages/medsina_externat_pkg/**'
            clinique:
              - 'apps/medsina_clinique/**'
              - 'packages/medsina_clinical_pkg/**'
            all_in_one:
              - 'apps/medsina_all_in_one/**'
              - 'lib/**'
            study_engine:
              - 'packages/medsina_study_engine/**'
            shared_core:
              - 'packages/medsina_core/**'
              - 'packages/medsina_practical_tools/**'
              - 'pubspec.yaml'
      - id: compute
        run: |
          APPS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APPS=("${{ inputs.app_name }}")
          elif [[ "${{ github.ref_name }}" == residanat-v* ]]; then
            APPS=("medsina_residanat")
          elif [[ "${{ github.ref_name }}" == clinique-v* ]]; then
            APPS=("medsina_clinique")
          elif [[ "${{ github.ref_name }}" == externat-v* ]]; then
            APPS=("medsina_externat")
          elif [[ "${{ github.ref_name }}" == all-v* ]]; then
            APPS=("medsina_all_in_one")
          else
            # Path-filtered main push
            CORE="${{ steps.changes.outputs.shared_core }}"
            STUDY="${{ steps.changes.outputs.study_engine }}"
            RES="${{ steps.changes.outputs.residanat }}"
            EXT="${{ steps.changes.outputs.externat }}"
            CLI="${{ steps.changes.outputs.clinique }}"
            ALL="${{ steps.changes.outputs.all_in_one }}"

            if [ "$CORE" = "true" ]; then
              APPS=("medsina_residanat" "medsina_externat" "medsina_clinique" "medsina_all_in_one")
            else
              if [ "$RES" = "true" ] || [ "$STUDY" = "true" ]; then
                APPS+=("medsina_residanat")
              fi
              if [ "$EXT" = "true" ] || [ "$STUDY" = "true" ]; then
                APPS+=("medsina_externat")
              fi
              if [ "$CLI" = "true" ]; then
                APPS+=("medsina_clinique")
              fi
              if [ "$ALL" = "true" ] || [ "$STUDY" = "true" ]; then
                APPS+=("medsina_all_in_one")
              fi
            fi
          fi

          if [ ${#APPS[@]} -eq 0 ]; then
            echo "apps_matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '"%s",' "${APPS[@]}")
            JSON="[${JSON%,}]"
            echo "apps_matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
          fi

  analyze-and-test:
    needs: detect-apps
    if: ${{ needs.detect-apps.outputs.has_apps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Bootstrap secrets for analysis
        run: |
          cp packages/medsina_core/lib/core/config/app_secrets.dart.example \
             packages/medsina_core/lib/core/config/app_secrets.dart
      - name: Resolve Dart Pub Workspace
        run: flutter pub get
      - name: Analyze all packages and apps
        run: flutter analyze --no-fatal-infos --no-fatal-warnings packages/* apps/*

  build-android:
    needs: [detect-apps, analyze-and-test]
    if: ${{ needs.detect-apps.outputs.has_apps == 'true' && (github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'android') }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Bootstrap secrets
        run: |
          cp packages/medsina_core/lib/core/config/app_secrets.dart.example \
             packages/medsina_core/lib/core/config/app_secrets.dart
      - name: Resolve workspace
        run: flutter pub get
      - name: Ensure Android scaffolding, branding & launcher icons
        run: |
          APP_NAME="${{ matrix.app }}"
          APP_DIR="apps/$APP_NAME"
          case "$APP_NAME" in
            medsina_residanat) ANDROID_LABEL="Medsina Résidanat" ;;
            medsina_clinique)  ANDROID_LABEL="Medsina Clinique" ;;
            medsina_externat)  ANDROID_LABEL="Medsina Étudiant" ;;
            *)                 ANDROID_LABEL="Medsina" ;;
          esac

          if [ ! -d "$APP_DIR/android" ]; then
            cp -r android "$APP_DIR/android"
            if [ "$APP_NAME" != "medsina_all_in_one" ]; then
              sed -i "s/applicationId = \"com.medsina.medsina\"/applicationId = \"com.medevsync.$APP_NAME\"/" "$APP_DIR/android/app/build.gradle.kts"
            fi
            sed -i "s/android:label=\"Medsina\"/android:label=\"$ANDROID_LABEL\"/" "$APP_DIR/android/app/src/main/AndroidManifest.xml"
          fi

          if [ "$APP_NAME" != "medsina_all_in_one" ]; then
            [ ! -d "$APP_DIR/web" ] && cp -r web "$APP_DIR/web"
            [ ! -d "$APP_DIR/windows" ] && cp -r windows "$APP_DIR/windows"
            (cd "$APP_DIR" && dart run flutter_launcher_icons)
          fi
      - name: Build Universal APK, Split arm64 APK, and AAB
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build appbundle --release
      - name: Stage Android release deliverables
        run: |
          APP_NAME="${{ matrix.app }}"
          APP_DIR="apps/$APP_NAME"
          case "$APP_NAME" in
            medsina_residanat) LABEL="Medsina_Residanat" ;;
            medsina_clinique)  LABEL="Medsina_Clinique" ;;
            medsina_externat)  LABEL="Medsina_Externat" ;;
            *)                 LABEL="Medsina" ;;
          esac
          RAW_VER=$(grep '^version:' "$APP_DIR/pubspec.yaml" | awk '{print $2}')
          VER="${RAW_VER%%+*}"
          mkdir -p "dist-android-$APP_NAME"
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" "dist-android-$APP_NAME/${LABEL}_v${VER}_Android.apk"
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist-android-$APP_NAME/${LABEL}_v${VER}_Android_arm64.apk"
          cp "$APP_DIR/build/app/outputs/bundle/release/app-release.aab" "dist-android-$APP_NAME/${LABEL}_v${VER}_GooglePlay.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android
          path: dist-android-${{ matrix.app }}/*

  build-web:
    needs: [detect-apps, analyze-and-test]
    if: ${{ needs.detect-apps.outputs.has_apps == 'true' && (github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'web') }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Bootstrap secrets
        run: |
          cp packages/medsina_core/lib/core/config/app_secrets.dart.example \
             packages/medsina_core/lib/core/config/app_secrets.dart
      - name: Resolve workspace
        run: flutter pub get
      - name: Ensure Web scaffolding & launcher icons
        run: |
          APP_NAME="${{ matrix.app }}"
          APP_DIR="apps/$APP_NAME"
          if [ ! -d "$APP_DIR/web" ]; then
            cp -r web "$APP_DIR/web"
          fi
          if [ "$APP_NAME" != "medsina_all_in_one" ]; then
            [ ! -d "$APP_DIR/android" ] && cp -r android "$APP_DIR/android"
            [ ! -d "$APP_DIR/windows" ] && cp -r windows "$APP_DIR/windows"
            (cd "$APP_DIR" && dart run flutter_launcher_icons)
          fi
      - name: Build Web
        working-directory: apps/${{ matrix.app }}
        run: flutter build web --release
      - name: Archive Web ZIP
        run: |
          APP_NAME="${{ matrix.app }}"
          APP_DIR="apps/$APP_NAME"
          case "$APP_NAME" in
            medsina_residanat) LABEL="Medsina_Residanat" ;;
            medsina_clinique)  LABEL="Medsina_Clinique" ;;
            medsina_externat)  LABEL="Medsina_Externat" ;;
            *)                 LABEL="Medsina" ;;
          esac
          RAW_VER=$(grep '^version:' "$APP_DIR/pubspec.yaml" | awk '{print $2}')
          VER="${RAW_VER%%+*}"
          mkdir -p "dist-web-$APP_NAME"
          (cd "$APP_DIR/build/web" && zip -r "../../../../dist-web-$APP_NAME/${LABEL}_v${VER}_Web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-web
          path: dist-web-${{ matrix.app }}/*

  build-windows:
    needs: [detect-apps, analyze-and-test]
    if: ${{ needs.detect-apps.outputs.has_apps == 'true' && (github.event_name == 'push' || inputs.build_target == 'all' || inputs.build_target == 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps_matrix) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Bootstrap secrets
        shell: pwsh
        run: |
          Copy-Item "packages/medsina_core/lib/core/config/app_secrets.dart.example" "packages/medsina_core/lib/core/config/app_secrets.dart"
      - name: Resolve workspace
        run: flutter pub get
      - name: Ensure Windows scaffolding, binary name & launcher icons
        shell: pwsh
        run: |
          $appName = "${{ matrix.app }}"
          $appDir = "apps/$appName"
          if (-not (Test-Path "$appDir/windows")) {
            Copy-Item -Recurse "windows" "$appDir/windows"
          }
          if ($appName -ne "medsina_all_in_one") {
            if (-not (Test-Path "$appDir/android")) { Copy-Item -Recurse "android" "$appDir/android" }
            if (-not (Test-Path "$appDir/web")) { Copy-Item -Recurse "web" "$appDir/web" }
            $cmake = Get-Content "$appDir/windows/CMakeLists.txt" -Raw
            $cmake = $cmake -replace 'set\(BINARY_NAME "medsina"\)', "set(BINARY_NAME `"$appName`")"
            Set-Content "$appDir/windows/CMakeLists.txt" $cmake
            Push-Location $appDir
            dart run flutter_launcher_icons
            Pop-Location
          }
      - name: Build Windows Release
        working-directory: apps/${{ matrix.app }}
        run: flutter build windows --release
      - name: Archive Windows Portable ZIP
        shell: pwsh
        run: |
          $appName = "${{ matrix.app }}"
          $appDir = "apps/$appName"
          $label = switch ($appName) {
            "medsina_residanat" { "Medsina_Residanat" }
            "medsina_clinique"  { "Medsina_Clinique" }
            "medsina_externat"  { "Medsina_Externat" }
            default             { "Medsina" }
          }
          $rawVer = (Select-String -Path "$appDir/pubspec.yaml" -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $ver = $rawVer.Split('+')[0]
          New-Item -ItemType Directory -Force -Path "dist-windows-$appName" | Out-Null
          Compress-Archive -Path "$appDir/build/windows/x64/runner/Release/*" -DestinationPath "dist-windows-$appName/${label}_v${ver}_Windows_Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: dist-windows-${{ matrix.app }}/*

  publish-release:
    needs: [detect-apps, build-android, build-web, build-windows]
    if: ${{ always() && needs.detect-apps.outputs.has_apps == 'true' && (needs.build-android.result == 'success' || needs.build-web.result == 'success' || needs.build-windows.result == 'success') && (github.event_name == 'push' || inputs.publish_release == true) }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.apps_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release metadata
        id: meta
        run: |
          APP_NAME="${{ matrix.app }}"
          case "$APP_NAME" in
            medsina_residanat) LABEL="Medsina_Residanat"; PREFIX="residanat"; APP_ID="medsina_residanat" ;;
            medsina_clinique)  LABEL="Medsina_Clinique";  PREFIX="clinique";  APP_ID="medsina_clinique" ;;
            medsina_externat)  LABEL="Medsina_Externat";  PREFIX="externat";  APP_ID="medsina_externat" ;;
            *)                 LABEL="Medsina";           PREFIX="all";       APP_ID="medsina_all" ;;
          esac
          RAW_VER=$(grep '^version:' "apps/$APP_NAME/pubspec.yaml" | awk '{print $2}')
          VER="${RAW_VER%%+*}"
          BUILD="${RAW_VER##*+}"
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref_name }}" == *-v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${PREFIX}-v${VER}"
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_num=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts for ${{ matrix.app }}
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.app }}-*
          path: dist-release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.label }} v${{ steps.meta.outputs.version }} (Build ${{ steps.meta.outputs.build_num }})"
          draft: false
          prerelease: false
          make_latest: ${{ matrix.app == 'medsina_all_in_one' }}
          files: dist-release/*
          body: |
            ## ${{ steps.meta.outputs.label }} v${{ steps.meta.outputs.version }} (Build ${{ steps.meta.outputs.build_num }})

            Plateforme modulaire Medsina — build multi-plateforme (Android APK / arm64 / AAB, Web, Windows Portable).

      - name: Register Per-App Release in Supabase OTA
        env:
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ID: ${{ steps.meta.outputs.app_id }}
          LABEL: ${{ steps.meta.outputs.label }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build_num }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not set. Skipping Supabase OTA registration."
            exit 0
          fi
          python3 -c "
          import os, requests

          url = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
          }
          app_id = os.environ['APP_ID']
          label = os.environ['LABEL']
          ver = os.environ['VERSION']
          build = int(os.environ['BUILD'])
          tag = os.environ['TAG']
          repo = os.environ['REPO']

          rows = [
              {
                  'app_id': app_id,
                  'platform': 'android',
                  'version_name': ver,
                  'build_number': build,
                  'release_notes': f'Mise à jour officielle de {label} (v{ver}).',
                  'download_url': f'https://github.com/{repo}/releases/download/{tag}/{label}_v{ver}_Android.apk',
                  'is_mandatory': False,
                  'min_supported_build': 1,
                  'is_active': True,
              },
              {
                  'app_id': app_id,
                  'platform': 'windows',
                  'version_name': ver,
                  'build_number': build,
                  'release_notes': f'Mise à jour officielle de {label} (v{ver}).',
                  'download_url': f'https://github.com/{repo}/releases/download/{tag}/{label}_v{ver}_Windows_Portable.zip',
                  'is_mandatory': False,
                  'min_supported_build': 1,
                  'is_active': True,
              },
          ]
          for row in rows:
              # Deactivate previous active releases for this app_id & platform so older 2000+ builds don't shadow new builds
              patch_url = f\"{url}/rest/v1/app_releases?app_id=eq.{app_id}&platform=eq.{row['platform']}&is_active=eq.true\"
              pr = requests.patch(patch_url, headers=headers, json={'is_active': False})
              print(f'Deactivated previous {app_id} {row[\"platform\"]} releases: HTTP {pr.status_code}')

              r = requests.post(f'{url}/rest/v1/app_releases', headers=headers, json=row)
              print(f'Registered {app_id} {row[\"platform\"]} v{ver}+{build}: HTTP {r.status_code}')
              if r.status_code >= 400:
                  print(r.text)
                  r.raise_for_status()
          "
