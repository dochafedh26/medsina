name: 💊 Medsina - Urgences & DCI Algérie

on:
  schedule:
    # Déclenché Mardi, Jeudi, Samedi à 02:45 UTC (= 03:45 heure d'Algérie)
    - cron: '45 2 * * 2,4,6'
  workflow_dispatch:
    inputs:
      dci:
        description: 'DCI spécifique optionnelle (laisser vide pour sélection automatique)'
        required: false
        default: ''
        type: string

concurrency:
  group: medsina-drugs-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-drug:
    name: 💊 Génération Fiche Médicament d Urgence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot (Urgences & DCI)
        env:
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CMD="python scripts/automation/medsina_agent.py --action drugs"
          if [ -n "${{ inputs.dci }}" ]; then
            CMD="$CMD --dci '${{ inputs.dci }}'"
          fi
          echo "🚀 Exécution : $CMD"
          eval $CMD

      - name: 💾 Synchroniser le cache local des assets hors-ligne
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json
          if git diff --staged --quiet; then
            echo "Aucune modification de fichier JSON à valider."
          else
            git commit -m "chore(automation): sync autonomous emergency drugs [skip ci]"
            git push
          fi
