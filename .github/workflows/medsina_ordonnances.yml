name: 📝 Medsina - Ordonnances Types DCI/CNAS (2x/jour)

on:
  schedule:
    # Exécution 2 fois par jour : 08:05 UTC (09:05 Alger) et 20:05 UTC (21:05 Alger)
    - cron: '5 8,20 * * *'
  workflow_dispatch:
    inputs:
      ordonnance:
        description: 'Pathologie ou thème d ordonnance spécifique optionnel (ex: Sinusite Maxillaire Aiguë, laisser vide pour auto)'
        required: false
        default: ''
        type: string
      count:
        description: 'Nombre d ordonnances types à générer lors de cette exécution (1 à 10)'
        required: false
        default: '1'
        type: string
      dry_run:
        description: 'Mode test (simulation sans écriture en base Supabase ni commit Git)'
        required: false
        default: false
        type: boolean

concurrency:
  group: medsina-ordonnances-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-ordonnance:
    name: 📝 Génération Ordonnance Type DCI/CNAS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot (Ordonnances Types)
        env:
          DISABLE_SOCIAL_BROADCAST: 'true'
          DISABLE_FACEBOOK_BROADCAST: 'true'
          DISABLE_TELEGRAM_BROADCAST: 'true'
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_ORDONNANCE: ${{ inputs.ordonnance }}
          INPUT_COUNT: ${{ inputs.count || '1' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--action ordonnance --count "$INPUT_COUNT")
          if [ -n "$INPUT_ORDONNANCE" ]; then
            ARGS+=(--ordonnance "$INPUT_ORDONNANCE")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "🚀 Exécution : python scripts/automation/medsina_agent.py ${ARGS[*]}"
          python scripts/automation/medsina_agent.py "${ARGS[@]}"

      - name: 💾 Synchroniser le cache local des assets hors-ligne
        if: inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/prescription_templates.json
          if git diff --staged --quiet; then
            echo "Aucune modification de fichier JSON à valider."
          else
            git commit -m "chore(automation): sync autonomous prescription templates [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
