name: Medsina Autonomous Medical Agent

on:
  schedule:
    # 1. Perle du Jour (Daily Pearl) : Every day at 05:00 UTC (06:00 Algérie)
    - cron: '0 5 * * *'
    # 2. Conduite à Tenir (CAT Protocol) : Monday, Wednesday, Friday at 02:00 UTC (03:00 Algérie)
    - cron: '0 2 * * 1,3,5'

  workflow_dispatch:
    inputs:
      action:
        description: 'Tâche à exécuter'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - cat
          - pearl
      course_id:
        description: 'ID optionnel d un cours cible spécifique (laisser vide pour aléatoire sans doublon)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Mode test (simulation sans écriture en base Supabase)'
        required: false
        default: false
        type: boolean

concurrency:
  group: medsina-automation
  cancel-in-progress: false

jobs:
  run-medical-agent:
    name: MedsinaPilot AI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qzfssrhhuorljftpdvjm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ACTION="${{ inputs.action }}"
          
          # If triggered by cron schedule:
          # At 02:00 -> generate CAT protocol
          # At 05:00 -> generate Daily Pearl
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CRON_HOUR=$(date -u +"%H")
            if [ "$CRON_HOUR" = "02" ]; then
              ACTION="cat"
            else
              ACTION="pearl"
            fi
          fi

          if [ -z "$ACTION" ]; then
            ACTION="both"
          fi

          CMD="python scripts/automation/medsina_agent.py --action $ACTION"

          if [ -n "${{ inputs.course_id }}" ]; then
            CMD="$CMD --course-id '${{ inputs.course_id }}'"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "🚀 Running command: $CMD"
          eval $CMD

