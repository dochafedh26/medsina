name: 🛠️ Medsina - Console Médicale d'Automatisation (Manuel)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Tâche à exécuter'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - both
          - cat
          - pearl
          - drugs
          - lab
          - memento
          - summary
          - ordonnance
      dci:
        description: 'DCI spécifique optionnelle pour médicament (ex: Labetalol, Esmolol)'
        required: false
        default: ''
        type: string
      lab:
        description: 'Nom d examen biologique spécifique (ex: Troponine hypersensible)'
        required: false
        default: ''
        type: string
      memento:
        description: 'Thème réflexe de garde spécifique (ex: OAP Flash, Status Épileptique)'
        required: false
        default: ''
        type: string
      ordonnance:
        description: 'Thème d ordonnance type spécifique (ex: Sinusite Maxillaire Aiguë)'
        required: false
        default: ''
        type: string
      course_id:
        description: 'ID optionnel d un cours cible spécifique pour CAT ou Perle'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Mode test (simulation sans écriture en base Supabase)'
        required: false
        default: false
        type: boolean

concurrency:
  group: medsina-manual-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-medical-agent:
    name: MedsinaPilot AI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot
        env:
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_MEDSINA_PAGE_ID: ${{ secrets.FB_MEDSINA_PAGE_ID }}
          FB_MEDSINA_PAGE_ACCESS_TOKEN: ${{ secrets.FB_MEDSINA_PAGE_ACCESS_TOKEN }}
          FB_MEDEVSYNC_PAGE_ID: ${{ secrets.FB_MEDEVSYNC_PAGE_ID }}
          FB_MEDEVSYNC_PAGE_ACCESS_TOKEN: ${{ secrets.FB_MEDEVSYNC_PAGE_ACCESS_TOKEN }}
          FB_BLIDA_PAGE_ID: ${{ secrets.FB_BLIDA_PAGE_ID }}
          FB_BLIDA_PAGE_ACCESS_TOKEN: ${{ secrets.FB_BLIDA_PAGE_ACCESS_TOKEN }}
          FB_CAT_PAGE_ID: ${{ secrets.FB_CAT_PAGE_ID || '102416914491075' }}
          FB_CAT_PAGE_ACCESS_TOKEN: ${{ secrets.FB_CAT_PAGE_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          INPUT_ACTION: ${{ inputs.action || 'all' }}
          INPUT_DCI: ${{ inputs.dci }}
          INPUT_LAB: ${{ inputs.lab }}
          INPUT_MEMENTO: ${{ inputs.memento }}
          INPUT_ORDONNANCE: ${{ inputs.ordonnance }}
          INPUT_COURSE_ID: ${{ inputs.course_id }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--action "$INPUT_ACTION")

          if [ -n "$INPUT_DCI" ]; then
            ARGS+=(--dci "$INPUT_DCI")
          fi

          if [ -n "$INPUT_LAB" ]; then
            ARGS+=(--lab "$INPUT_LAB")
          fi

          if [ -n "$INPUT_MEMENTO" ]; then
            ARGS+=(--memento "$INPUT_MEMENTO")
          fi

          if [ -n "$INPUT_ORDONNANCE" ]; then
            ARGS+=(--ordonnance "$INPUT_ORDONNANCE")
          fi

          if [ -n "$INPUT_COURSE_ID" ]; then
            ARGS+=(--course-id "$INPUT_COURSE_ID")
          fi

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "🚀 Running command: python scripts/automation/medsina_agent.py ${ARGS[*]}"
          python scripts/automation/medsina_agent.py "${ARGS[@]}"

      - name: 💾 Synchroniser le cache local des assets hors-ligne
        if: inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json
          if git diff --staged --quiet; then
            echo "Aucune modification de fichier JSON à valider."
          else
            git commit -m "chore(automation): sync autonomous practical tools cache [skip ci]"
            git push
          fi
