name: 🛠️ Medsina - Console Médicale d'Automatisation (Manuel)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Tâche à exécuter'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - both
          - cat
          - pearl
          - drugs
          - lab
          - memento
          - summary
      dci:
        description: 'DCI spécifique optionnelle pour médicament (ex: Labetalol, Esmolol)'
        required: false
        default: ''
        type: string
      lab:
        description: 'Nom d examen biologique spécifique (ex: Troponine hypersensible)'
        required: false
        default: ''
        type: string
      memento:
        description: 'Thème réflexe de garde spécifique (ex: OAP Flash, Status Épileptique)'
        required: false
        default: ''
        type: string
      course_id:
        description: 'ID optionnel d un cours cible spécifique pour CAT ou Perle'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Mode test (simulation sans écriture en base Supabase)'
        required: false
        default: false
        type: boolean

concurrency:
  group: medsina-manual-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-medical-agent:
    name: MedsinaPilot AI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot
        env:
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ACTION="${{ inputs.action || 'all' }}"

          CMD="python scripts/automation/medsina_agent.py --action $ACTION"

          if [ -n "${{ inputs.dci }}" ]; then
            CMD="$CMD --dci '${{ inputs.dci }}'"
          fi

          if [ -n "${{ inputs.lab }}" ]; then
            CMD="$CMD --lab '${{ inputs.lab }}'"
          fi

          if [ -n "${{ inputs.memento }}" ]; then
            CMD="$CMD --memento '${{ inputs.memento }}'"
          fi

          if [ -n "${{ inputs.course_id }}" ]; then
            CMD="$CMD --course-id '${{ inputs.course_id }}'"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "🚀 Running command: $CMD"
          eval $CMD

      - name: 💾 Synchroniser le cache local des assets hors-ligne
        if: inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json
          if git diff --staged --quiet; then
            echo "Aucune modification de fichier JSON à valider."
          else
            git commit -m "chore(automation): sync autonomous practical tools cache [skip ci]"
            git push
          fi
