name: Medsina Autonomous Medical Agent

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/medsina_automation.yml'
      - 'scripts/automation/**'

  schedule:
    # 1. Perle du Jour (Daily Pearl) : Every day at 05:15 UTC (= 06:15 heure d'Algérie)
    - cron: '15 5 * * *'
    # 2. Conduite à Tenir (CAT Protocol) : Lundi, Mercredi, Vendredi à 01:15 UTC (= 02:15 heure d'Algérie)
    - cron: '15 1 * * 1,3,5'
    # 3. Urgences & DCI Algérie (Emergency Drugs) : Mardi & Jeudi à 01:15 UTC (= 02:15 heure d'Algérie)
    - cron: '15 1 * * 2,4'

  workflow_dispatch:
    inputs:
      action:
        description: 'Tâche à exécuter'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - both
          - cat
          - pearl
          - drugs
      dci:
        description: 'DCI spécifique optionnelle (ex: Labetalol, Esmolol, Céfépime)'
        required: false
        default: ''
        type: string
      course_id:
        description: 'ID optionnel d un cours cible spécifique pour CAT ou Perle'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Mode test (simulation sans écriture en base Supabase)'
        required: false
        default: false
        type: boolean

concurrency:
  group: medsina-automation
  cancel-in-progress: false

jobs:
  run-medical-agent:
    name: MedsinaPilot AI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qzfssrhhuorljftpdvjm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ACTION="${{ inputs.action }}"
          
          # If triggered by cron schedule:
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CRON_HOUR=$(date -u +"%H")
            CRON_DOW=$(date -u +"%u") # 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat, 7=Sun
            if [ "$CRON_HOUR" -ge 1 ] && [ "$CRON_HOUR" -le 3 ]; then
              if [ "$CRON_DOW" = "2" ] || [ "$CRON_DOW" = "4" ]; then
                ACTION="drugs"
              else
                ACTION="cat"
              fi
            else
              ACTION="pearl"
            fi
          fi

          if [ -z "$ACTION" ]; then
            ACTION="all"
          fi

          CMD="python scripts/automation/medsina_agent.py --action $ACTION"

          if [ -n "${{ inputs.dci }}" ]; then
            CMD="$CMD --dci '${{ inputs.dci }}'"
          fi

          if [ -n "${{ inputs.course_id }}" ]; then
            CMD="$CMD --course-id '${{ inputs.course_id }}'"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "🚀 Running command: $CMD"
          eval $CMD
