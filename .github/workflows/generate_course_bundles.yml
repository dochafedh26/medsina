name: Generate Residanat 2027 Course Revision Booklets

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Specific Course ID (or "all")'
        required: false
        default: 'all'
      limit:
        description: 'Maximum number of courses to process'
        required: false
        default: '15'
      hypertombable_only:
        description: 'Only generate for Hypertombable courses'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [generate_course_bundle]
  schedule:
    # Run every night at 02:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  build-booklets:
    name: Build & Publish All-in-One Livrets Residanat 2027
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PDF & Database Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pymupdf pypdf requests

      - name: Run Course Revision Booklet Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.course_id }}" != "" ] && [ "${{ github.event.inputs.course_id }}" != "all" ]; then
            EXTRA_ARGS="--course-id ${{ github.event.inputs.course_id }}"
          else
            EXTRA_ARGS="--limit ${{ github.event.inputs.limit || '15' }}"
          fi

          if [ "${{ github.event.inputs.hypertombable_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --hypertombable-only"
          fi

          echo "🚀 Executing generator with args: $EXTRA_ARGS"
          python medsina/scripts/automation/generate_residanat_course_bundle.py $EXTRA_ARGS

      - name: Upload Generated Booklets as GitHub Artifacts (Optional backup)
        uses: actions/upload-artifact@v4
        with:
          name: livrets-residanat-2027-pdf
          path: livrets_residanat_2027/*.pdf
          if-no-files-found: ignore
