name: Generate Residanat 2027 Course Revision Booklets

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: 'Specific Course ID (or "all")'
        required: false
        default: 'all'
      limit:
        description: 'Maximum number of courses to process'
        required: false
        default: '15'
      hypertombable_only:
        description: 'Only generate for Hypertombable courses'
        required: false
        type: boolean
        default: false
      broadcast:
        description: 'Broadcast to In-App, Facebook 4 Pages & Telegram'
        required: false
        type: boolean
        default: true
      showcase:
        description: 'Showcase Mode (include full download link in public post)'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [generate_course_bundle]# 
#   schedule:
#     # Run every night at 02:00 AM UTC
#     - cron: '0 2 * * *'

jobs:
  build-booklets:
    name: Build & Publish All-in-One Livrets Residanat 2027
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PDF & Database Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pymupdf pypdf requests

      - name: Run Course Revision Booklet Generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qzfssrhhuorljftpdvjm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_MEDSINA_PAGE_ID: ${{ secrets.FB_MEDSINA_PAGE_ID }}
          FB_MEDSINA_PAGE_ACCESS_TOKEN: ${{ secrets.FB_MEDSINA_PAGE_ACCESS_TOKEN }}
          FB_MEDEVSYNC_PAGE_ID: ${{ secrets.FB_MEDEVSYNC_PAGE_ID }}
          FB_MEDEVSYNC_PAGE_ACCESS_TOKEN: ${{ secrets.FB_MEDEVSYNC_PAGE_ACCESS_TOKEN }}
          FB_BLIDA_PAGE_ID: ${{ secrets.FB_BLIDA_PAGE_ID }}
          FB_BLIDA_PAGE_ACCESS_TOKEN: ${{ secrets.FB_BLIDA_PAGE_ACCESS_TOKEN }}
          FB_CAT_PAGE_ID: ${{ secrets.FB_CAT_PAGE_ID || '102416914491075' }}
          FB_CAT_PAGE_ACCESS_TOKEN: ${{ secrets.FB_CAT_PAGE_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.course_id }}" != "" ] && [ "${{ github.event.inputs.course_id }}" != "all" ]; then
            EXTRA_ARGS="--course-id ${{ github.event.inputs.course_id }}"
          else
            EXTRA_ARGS="--limit ${{ github.event.inputs.limit || '15' }}"
          fi

          if [ "${{ github.event.inputs.hypertombable_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --hypertombable-only"
          fi

          if [ "${{ github.event.inputs.broadcast }}" != "false" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --broadcast"
          fi

          if [ "${{ github.event.inputs.showcase }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --showcase"
          fi

          echo "🚀 Executing generator with args: $EXTRA_ARGS"
          python scripts/automation/generate_residanat_course_bundle.py $EXTRA_ARGS

      - name: Upload Generated Booklets as GitHub Artifacts (Optional backup)
        uses: actions/upload-artifact@v4
        with:
          name: livrets-residanat-2027-pdf
          path: livrets_residanat_2027/*.pdf
          if-no-files-found: ignore
