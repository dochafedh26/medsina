name: 💡 Medsina - Perle du Jour & Pièges

on:
  schedule:
    # Déclenché une fois par jour à 03:53 UTC (Perle du Jour unique quotidienne)
    - cron: '53 3 * * *'
  workflow_dispatch:
    inputs:
      course_id:
        description: 'ID optionnel d un cours cible pour la perle'
        required: false
        default: ''
        type: string

concurrency:
  group: medsina-pearl-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-pearl:
    name: 💡 Génération Perle du Jour & Pièges
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le code Medsina
        uses: actions/checkout@v4

      - name: 🐍 Configurer l environnement Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/automation/requirements.txt'

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/automation/requirements.txt

      - name: 🩺 Exécuter l Agent Médical MedsinaPilot (Perle)
        env:
          SUPABASE_URL: 'https://qzfssrhhuorljftpdvjm.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CMD="python scripts/automation/medsina_agent.py --action pearl"
          if [ -n "${{ inputs.course_id }}" ]; then
            CMD="$CMD --course-id '${{ inputs.course_id }}'"
          fi
          echo "🚀 Exécution : $CMD"
          eval $CMD

      - name: 💾 Synchroniser le cache local des assets hors-ligne
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json
          if git diff --staged --quiet; then
            echo "Aucune modification de fichier JSON à valider."
          else
            git commit -m "chore(automation): sync autonomous daily pearls [skip ci]"
            git push
          fi

