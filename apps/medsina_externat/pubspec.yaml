name: medsina_externat
description: Medsina Étudiant — Cursus Médical & Externat (1ère - 6ème Année), EMDs & Normes.
version: 1.0.82+107
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  medsina_core: any
  medsina_practical_tools: any
  medsina_study_engine: any
  medsina_externat_pkg: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#2563EB"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
